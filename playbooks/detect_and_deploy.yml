---
# =============================================================
# Playbook principal: Clona un repositorio y lo inicia según
# el tipo de proyecto detectado.
#
# Uso:
#   ansible-playbook site.yml -e "repo_url=https://github.com/user/repo dest=/opt/myapp"
# =============================================================

- name: Desplegar y arrancar proyecto desde repositorio
  hosts: targets
  become: true

  vars:
    repo_url: "https://github.com/user/my-project"   # override con -e
    dest: "/opt/deployed_app"                         # directorio destino
    branch: "main"                                    # rama a clonar
    app_port: 3000                                    # puerto por defecto

  roles:
    - clone_repo
    - detect_project
    - start_project
