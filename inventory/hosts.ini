# =============================================================
#  Inventario de servidores - Ansible Docker Deployer
# =============================================================
# Edita este archivo con tus servidores reales.
# Documentación: https://docs.ansible.com/ansible/latest/user_guide/intro_inventory.html

[docker_hosts]
# --- Ejemplos de configuración ---

# Servidor con IP y usuario específico
# servidor1 ansible_host=192.168.1.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

# Servidor con contraseña (no recomendado en producción, usar vault)
# servidor2 ansible_host=192.168.1.11 ansible_user=admin ansible_password=secret

# Servidor en la nube (AWS/GCP/Azure)
# web-prod ansible_host=54.123.45.67 ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/aws-key.pem

# Máquina local (para pruebas)
# localhost ansible_connection=local

# --- Agrega tus servidores aquí ---
# mi-servidor ansible_host=X.X.X.X ansible_user=tu_usuario


[docker_hosts:vars]
# Variables aplicables a todos los hosts del grupo
ansible_python_interpreter=/usr/bin/python3
# ansible_ssh_private_key_file=~/.ssh/id_rsa


# ---------------------------------------------------------------
# Grupos adicionales (opcional)
# ---------------------------------------------------------------

[staging]
# staging-server ansible_host=192.168.2.10 ansible_user=ubuntu

[production]
# prod-server-1 ansible_host=10.0.0.10 ansible_user=ubuntu
# prod-server-2 ansible_host=10.0.0.11 ansible_user=ubuntu

[staging:vars]
deploy_env=staging
docker_pull_always=true

[production:vars]
deploy_env=production
docker_pull_always=true
backup_before_deploy=false
