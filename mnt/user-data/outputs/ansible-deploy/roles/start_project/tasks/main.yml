---
# ---------------------------------------------------------------
# Rol: start_project
# Delega al archivo de tareas específico según `project_type`.
# ---------------------------------------------------------------

- name: Iniciar proyecto Node.js
  ansible.builtin.include_tasks: node.yml
  when: project_type == "node"

- name: Iniciar proyecto Django
  ansible.builtin.include_tasks: python_django.yml
  when: project_type == "python_django"

- name: Iniciar proyecto Flask / WSGI
  ansible.builtin.include_tasks: python_flask.yml
  when: project_type == "python_flask"

- name: Iniciar proyecto Python genérico
  ansible.builtin.include_tasks: python_generic.yml
  when: project_type == "python_generic"

- name: Iniciar proyecto Java Maven
  ansible.builtin.include_tasks: java_maven.yml
  when: project_type == "java_maven"

- name: Iniciar proyecto Java Gradle
  ansible.builtin.include_tasks: java_gradle.yml
  when: project_type == "java_gradle"

- name: Iniciar proyecto PHP
  ansible.builtin.include_tasks: php.yml
  when: project_type == "php"

- name: Servir sitio estático
  ansible.builtin.include_tasks: static.yml
  when: project_type == "static"

- name: Tipo de proyecto desconocido
  ansible.builtin.debug:
    msg: >
      ⚠️  No se reconoció el tipo de proyecto ({{ project_type }}).
      Revisa el repositorio o añade soporte en el rol start_project.
  when: project_type == "unknown"
