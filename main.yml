---
# ---------------------------------------------------------------
# Rol: detect_project
# Examina el contenido del repositorio clonado y establece
# la variable `project_type` con uno de los valores:
#   node | python_django | python_flask | python_generic |
#   java_maven | java_gradle | php | static | unknown
# ---------------------------------------------------------------

- name: Verificar presencia de archivos clave
  ansible.builtin.stat:
    path: "{{ dest }}/{{ item }}"
  loop:
    - package.json
    - manage.py
    - app.py
    - wsgi.py
    - pom.xml
    - build.gradle
    - composer.json
    - index.html
    - Makefile
    - requirements.txt
  register: file_checks

# Construir un dict { filename: exists } para facilitar la lectura
- name: Construir mapa de archivos detectados
  ansible.builtin.set_fact:
    detected_files: >-
      {{
        detected_files | default({}) |
        combine({ item.item: item.stat.exists })
      }}
  loop: "{{ file_checks.results }}"

- name: Determinar tipo de proyecto
  ansible.builtin.set_fact:
    project_type: >-
      {%- if detected_files['package.json'] -%}
        node
      {%- elif detected_files['manage.py'] -%}
        python_django
      {%- elif detected_files['app.py'] or detected_files['wsgi.py'] -%}
        python_flask
      {%- elif detected_files['pom.xml'] -%}
        java_maven
      {%- elif detected_files['build.gradle'] -%}
        java_gradle
      {%- elif detected_files['composer.json'] -%}
        php
      {%- elif detected_files['requirements.txt'] -%}
        python_generic
      {%- elif detected_files['index.html'] -%}
        static
      {%- else -%}
        unknown
      {%- endif -%}

- name: Mostrar tipo de proyecto detectado
  ansible.builtin.debug:
    msg: "Tipo de proyecto detectado: {{ project_type }}"
