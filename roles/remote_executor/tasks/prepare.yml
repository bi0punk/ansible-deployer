---
- name: Crear directorio base remoto
  ansible.builtin.file:
    path: "{{ remote_app_dir }}"
    state: directory
    owner: "{{ run_user }}"
    group: "{{ run_group }}"
    mode: '0755'
  when: ensure_remote_dir | bool

- name: Crear directorio de payload remoto
  ansible.builtin.file:
    path: "{{ remote_payload_dir }}"
    state: directory
    owner: "{{ run_user }}"
    group: "{{ run_group }}"
    mode: '0755'
  when: upload_payload | bool
