---
- name: Buscar archivos Compose candidatos
  ansible.builtin.stat:
    path: "{{ runner_effective_workdir }}/{{ item }}"
  loop: "{{ compose_autodetect_files }}"
  register: compose_candidate_stats

- name: Buscar entrypoints candidatos
  ansible.builtin.stat:
    path: "{{ runner_effective_workdir }}/{{ item }}"
  loop: "{{ entrypoint_autodetect_files }}"
  register: entrypoint_candidate_stats

- name: Buscar scripts Python candidatos
  ansible.builtin.stat:
    path: "{{ runner_effective_workdir }}/{{ item }}"
  loop: "{{ python_autodetect_files }}"
  register: python_candidate_stats

- name: Buscar scripts shell candidatos por prioridad
  ansible.builtin.stat:
    path: "{{ runner_effective_workdir }}/{{ item }}"
  loop: "{{ shell_autodetect_files }}"
  register: shell_candidate_stats

- name: Buscar cualquier script shell de respaldo
  ansible.builtin.find:
    paths: "{{ runner_effective_workdir }}"
    patterns: "{{ shell_autodetect_patterns }}"
    recurse: false
    file_type: file
  register: shell_fallback_files

- name: Consolidar hallazgos de autodetección
  ansible.builtin.set_fact:
    detected_compose_files: "{{ compose_candidate_stats.results | selectattr('stat.exists') | map(attribute='item') | list }}"
    detected_entrypoint_path: "{{ (entrypoint_candidate_stats.results | selectattr('stat.exists') | map(attribute='item') | list | first) | default('') }}"
    detected_python_script: "{{ (python_candidate_stats.results | selectattr('stat.exists') | map(attribute='item') | list | first) | default('') }}"
    detected_shell_script: "{{ (shell_candidate_stats.results | selectattr('stat.exists') | map(attribute='item') | list | first) | default((shell_fallback_files.files | map(attribute='path') | map('basename') | list | first) | default('')) }}"

- name: Determinar modo detectado
  ansible.builtin.set_fact:
    detected_runner_mode: "{{ 'compose' if (detected_compose_files | length > 0) else 'entrypoint' if (detected_entrypoint_path | length > 0) else 'python' if (detected_python_script | length > 0) else 'shell' if (detected_shell_script | length > 0) else 'unknown' }}"

- name: Fallar si no se pudo detectar cómo correr el repo
  ansible.builtin.assert:
    that:
      - detected_runner_mode != 'unknown'
    fail_msg: >-
      No pude detectar cómo ejecutar el proyecto en {{ runner_effective_workdir }}.
      Revisé Compose ({{ compose_autodetect_files | join(', ') }}), entrypoint,
      scripts Python y scripts shell. Fuerza runner_mode manualmente si tu repo usa otra convención.

- name: Aplicar autodetección al runner
  ansible.builtin.set_fact:
    runner_mode: "{{ detected_runner_mode }}"
    compose_files: "{{ detected_compose_files | map('regex_replace', '^', runner_effective_workdir ~ '/') | list if detected_runner_mode == 'compose' else compose_files }}"
    entrypoint_path: "{{ runner_effective_workdir ~ '/' ~ detected_entrypoint_path if detected_runner_mode == 'entrypoint' else entrypoint_path }}"
    python_script_path: "{{ runner_effective_workdir ~ '/' ~ detected_python_script if detected_runner_mode == 'python' else python_script_path }}"
    shell_script_path: "{{ runner_effective_workdir ~ '/' ~ detected_shell_script if detected_runner_mode == 'shell' else shell_script_path }}"

- name: Mostrar resultado de autodetección
  ansible.builtin.debug:
    msg:
      - "runner_mode_detected={{ runner_mode }}"
      - "runner_effective_workdir={{ runner_effective_workdir }}"
      - "compose_files={{ compose_files if runner_mode == 'compose' else [] }}"
      - "entrypoint_path={{ entrypoint_path if runner_mode == 'entrypoint' else '' }}"
      - "python_script_path={{ python_script_path if runner_mode == 'python' else '' }}"
      - "shell_script_path={{ shell_script_path if runner_mode == 'shell' else '' }}"
